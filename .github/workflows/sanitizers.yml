name: sanitizers

on:
  push:
    # Branches only: image builds push a tag to every component repository.
    branches: ['**']
  pull_request:

jobs:
  address:
    runs-on: ${{ fromJSON(vars.OFFICE_RUNNERS == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","x64","office"]' || '"ubuntu-latest"') }}
    container:
      image: ghcr.io/rauc/rauc/rauc-ci:latest
      # allow mounting and devtmpfs in the container
      options: --user=root --privileged -v /dev:/dev
    steps:
    - name: Inspect environment
      run: |
        whoami
        gcc --version
        ls -l /dev/kvm || true

    - uses: actions/checkout@v4

    - name: Run meson
      run: |
        meson setup build -Db_sanitize=address,undefined
        meson configure build
        meson compile -C build

    - name: Run tests
      run: |
        ./qemu-test asan

    - name: Show logs
      if: ${{ failure() }}
      run: |
        cat build/meson-logs/testlog.txt || true
